<svg viewBox="0 0 1180 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C24A2B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="620" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="40" y="42" font-size="24" font-weight="700" fill="#1A2130">RakshakNet / Aegis-Grid — System Architecture</text>
  <text x="40" y="64" font-size="13" fill="#6B7280">SIH26178 · Qualcomm — resilient AI environmental monitoring network</text>

  <!-- ===== Column 1: Field / Edge nodes ===== -->
  <text x="40" y="105" font-size="13" font-weight="700" fill="#3F5C4D" letter-spacing="0.3">FIELD NODES (EDGE AI)</text>

  <!-- Flood node -->
  <rect x="40" y="120" width="230" height="108" rx="10" fill="#F4F8F6" stroke="#3F5C4D" stroke-width="1.5"/>
  <text x="58" y="145" font-size="14" font-weight="700" fill="#20402F">Flood / Flash Flood Node</text>
  <text x="58" y="166" font-size="12" fill="#3F5C4D">Water level · Rain gauge</text>
  <text x="58" y="184" font-size="12" fill="#3F5C4D">Soil moisture · Humidity/Temp</text>
  <text x="58" y="202" font-size="12" fill="#3F5C4D">+ satellite &amp; weather feed</text>
  <text x="58" y="220" font-size="11" font-style="italic" fill="#6B8577">on-device inference</text>

  <!-- Fire node -->
  <rect x="40" y="242" width="230" height="108" rx="10" fill="#FBF5F0" stroke="#8A4A2B" stroke-width="1.5"/>
  <text x="58" y="267" font-size="14" font-weight="700" fill="#7A3A1D">Forest Fire Node</text>
  <text x="58" y="288" font-size="12" fill="#8A4A2B">MQ2 gas · DHT22 (temp/humidity)</text>
  <text x="58" y="306" font-size="12" fill="#8A4A2B">Onboard camera — visual</text>
  <text x="58" y="324" font-size="12" fill="#8A4A2B">fire confirmation</text>
  <text x="58" y="342" font-size="11" font-style="italic" fill="#A67857">on-device inference</text>

  <!-- Pollution / camera node -->
  <rect x="40" y="364" width="230" height="108" rx="10" fill="#F2F5FB" stroke="#334E82" stroke-width="1.5"/>
  <text x="58" y="389" font-size="14" font-weight="700" fill="#233B66">Air Quality + Camera Node</text>
  <text x="58" y="410" font-size="12" fill="#334E82">Air pollution sensor</text>
  <text x="58" y="428" font-size="12" fill="#334E82">Camera — person detection</text>
  <text x="58" y="446" font-size="12" fill="#334E82">in threat zones</text>
  <text x="58" y="464" font-size="11" font-style="italic" fill="#5A729E">on-device inference</text>

  <!-- ===== Arrows col1 -> col2 ===== -->
  <path d="M270,174 L330,174 L330,300 L360,300" fill="none" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M270,296 L360,296" fill="none" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M270,418 L330,418 L330,300" fill="none" stroke="#4A5568" stroke-width="2"/>

  <!-- ===== Column 2: Backend ===== -->
  <text x="360" y="105" font-size="13" font-weight="700" fill="#1A2130" letter-spacing="0.3">AGGREGATION SERVER</text>
  <rect x="360" y="230" width="240" height="140" rx="10" fill="#1E2430" stroke="#1E2430"/>
  <text x="380" y="260" font-size="14" font-weight="700" fill="#FFFFFF">Threat Aggregation &amp;</text>
  <text x="380" y="278" font-size="14" font-weight="700" fill="#FFFFFF">Zone Correlation</text>
  <text x="380" y="302" font-size="12" fill="#C6CCD6">Store-and-forward for</text>
  <text x="380" y="318" font-size="12" fill="#C6CCD6">intermittent connectivity</text>
  <text x="380" y="342" font-size="12" fill="#C6CCD6">Time-series store</text>
  <text x="380" y="358" font-size="12" fill="#C6CCD6">Severity threshold rules</text>

  <!-- ===== Arrows col2 -> col3 ===== -->
  <path d="M600,270 L660,270 L660,150 L700,150" fill="none" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M600,300 L700,300" fill="none" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M600,330 L660,330 L660,470 L700,470" fill="none" stroke="#C24A2B" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- ===== Column 3: Outputs ===== -->
  <text x="700" y="105" font-size="13" font-weight="700" fill="#1A2130" letter-spacing="0.3">OUTPUTS</text>

  <!-- Authority dashboard -->
  <rect x="700" y="120" width="230" height="100" rx="10" fill="#F2F5FB" stroke="#334E82" stroke-width="1.5"/>
  <text x="718" y="146" font-size="14" font-weight="700" fill="#233B66">Authority Dashboard</text>
  <text x="718" y="167" font-size="12" fill="#334E82">Per-zone metrics + ML cause</text>
  <text x="718" y="185" font-size="12" fill="#334E82">Stranded-people locations</text>
  <text x="718" y="203" font-size="12" fill="#334E82">Full confidence scores</text>

  <!-- Citizen dashboard -->
  <rect x="700" y="250" width="230" height="100" rx="10" fill="#F4F8F6" stroke="#3F5C4D" stroke-width="1.5"/>
  <text x="718" y="276" font-size="14" font-weight="700" fill="#20402F">Citizen Dashboard</text>
  <text x="718" y="297" font-size="12" fill="#3F5C4D">Simplified threat level</text>
  <text x="718" y="315" font-size="12" fill="#3F5C4D">Safe-zone map + navigation</text>
  <text x="718" y="333" font-size="12" fill="#3F5C4D">Stranded-people alerts</text>

  <!-- SMS gateway -->
  <rect x="700" y="420" width="230" height="100" rx="10" fill="#FBF0EE" stroke="#C24A2B" stroke-width="1.5"/>
  <text x="718" y="446" font-size="14" font-weight="700" fill="#8F3520">SMS Alert Gateway</text>
  <text x="718" y="467" font-size="12" fill="#C24A2B">Fires on severity threshold</text>
  <text x="718" y="485" font-size="12" fill="#C24A2B">Templated, zone-targeted</text>
  <text x="718" y="503" font-size="12" fill="#C24A2B">alerts to registered numbers</text>

  <!-- ===== Column 4: end users ===== -->
  <path d="M930,170 L1000,170" fill="none" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M930,300 L1000,300" fill="none" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M930,470 L1000,470" fill="none" stroke="#C24A2B" stroke-width="2" marker-end="url(#arrowRed)"/>

  <rect x="1000" y="130" width="140" height="80" rx="10" fill="#FFFFFF" stroke="#8A93A3" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="1070" y="175" font-size="12" fill="#3B4250" text-anchor="middle">District &amp;</text>
  <text x="1070" y="192" font-size="12" fill="#3B4250" text-anchor="middle">rescue teams</text>

  <rect x="1000" y="260" width="140" height="80" rx="10" fill="#FFFFFF" stroke="#8A93A3" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="1070" y="305" font-size="12" fill="#3B4250" text-anchor="middle">Citizens</text>

  <rect x="1000" y="430" width="140" height="80" rx="10" fill="#FFFFFF" stroke="#8A93A3" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="1070" y="475" font-size="12" fill="#3B4250" text-anchor="middle">Phones in</text>
  <text x="1070" y="492" font-size="12" fill="#3B4250" text-anchor="middle">affected zone</text>

  <!-- Legend -->
  <text x="40" y="560" font-size="11" fill="#6B7280">Field nodes run inference locally (edge AI) — only classified events, not raw streams, travel upstream.</text>
  <text x="40" y="580" font-size="11" fill="#6B7280">Red path = high-severity threshold trigger, bypassing normal dashboard refresh cycle for immediate SMS dispatch.</text>
</svg>
